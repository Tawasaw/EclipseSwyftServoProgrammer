name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}


    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Set version from tag
        shell: bash
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Generate app icons
        run: npm run icons

      - name: Run protocol tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Eclipse30618 Swyft Servo Programmer ${{ github.ref_name }}"
          releaseBody: |
            | Platform | File |
            |----------|------|
            | macOS (Intel + Apple Silicon) | `.dmg` |
            | Windows | `.msi` or `-setup.exe` (CP210x driver: [Silicon Labs](https://www.silabs.com/developer-tools/usb-to-uart-bridge-vcp-drivers)) |
            | Linux | `.deb`, `.rpm`, or `.AppImage` |

            > **macOS:** the app is not notarized. On first launch, right-click → **Open**.

            Wiring guide and parts list: see the [README](https://github.com/${{ github.repository }}#readme).
            Cross-platform port of [SWYFT Servo Programmer V2](https://github.com/SWYFT-Robotics/swyft-servo-programmer-v2) by SWYFT Robotics.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Verify all platforms and publish release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Verify release installers
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > assets.txt
          python3 - <<'PY'
          from pathlib import Path

          assets = Path("assets.txt").read_text().splitlines()
          required = {
              "macOS universal": "_universal.dmg",
              "Windows MSI": ".msi",
              "Windows setup": "-setup.exe",
              "Linux Debian": ".deb",
              "Linux RPM": ".rpm",
              "Linux AppImage": ".AppImage",
          }
          missing = [name for name, suffix in required.items()
                     if not any(asset.endswith(suffix) for asset in assets)]
          if missing:
              raise SystemExit("Missing release installers: " + ", ".join(missing))
          print("Verified installers: " + ", ".join(assets))
          PY

      - name: Publish complete release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
